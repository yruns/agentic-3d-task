voxel_size_m = 0.025
dbscan_eps_m = 0.1
dbscan_min_points = 10
association_distance_m = 0.12
envelope_margin_m = 0.10
association_threshold = 0.92
merge_overlap_threshold = 0.35
merge_image_similarity = 0.75
merge_text_similarity = 0.78
maintenance_interval = 8
confirmation_observations = 3
min_clip_similarity = 0.185
erode_mask_pixels = 1
depth_trim_quantile = 0.15
same_category_bonus = 0.20

[spatial]
fine_cell_size_m = 0.05
region_size_m = 0.5
# Explicit planning clearance, not a claim of independently measured body size.
robot_radius_m = 0.20
clearance_m = 0.025
