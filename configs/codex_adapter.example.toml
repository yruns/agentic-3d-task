# Copy to the ignored codex_adapter.toml and replace each upstream's AK.
# Real AKs belong only in the private file, never in this tracked example.
schema_version = 2

[server]
host = "127.0.0.1"
port = 8787
# Optional local adapter authentication, not an upstream model AK.
# auth_env = "CODEX_ADAPTER_TOKEN"
max_request_bytes = 33554432
max_response_bytes = 67108864
max_concurrent_requests = 32
requests_per_minute = 600
upstream_timeout_seconds = 300.0
connect_timeout_seconds = 15.0

[state]
database = "../.codex-adapter/state.sqlite"
session_ttl_seconds = 86400
max_sessions = 10000
max_turns = 256
max_state_bytes = 33554432

[[models]]
id = "gpt-5.4-2026-03-05"
protocol = "responses"

# Every route carries its own full URL + AK + weight. URLs may differ.
[[models.upstreams]]
id = "gpt54_a"
version = "v1"
url = "https://aidp-i18ntt-sg.tiktok-row.net/api/modelhub/online/unified/v1/responses"
ak = "replace-with-gpt54-a-ak"
weight = 200
status = "active"

[[models.upstreams]]
id = "gpt54_b"
version = "v1"
url = "https://aidp-i18ntt-sg.tiktok-row.net/api/modelhub/online/unified/v1/responses"
ak = "replace-with-gpt54-b-ak"
weight = 20
status = "active"

[[models.upstreams]]
id = "gpt54_c"
version = "v1"
url = "https://aidp-i18ntt-sg.tiktok-row.net/api/modelhub/online/unified/v1/responses"
ak = "replace-with-gpt54-c-ak"
weight = 100
status = "active"

[[models]]
id = "gemini-3.8-flash"
protocol = "gemini_chat"

# Enable schema/images for this Gemini profile; verify upstream acceptance separately.
[models.capabilities]
structured_output = true
images = true
function_tools = true
namespace_tools = true
parallel_tools = true
reasoning_summary = false
reasoning_efforts = []
default_max_output_tokens = 10240

[[models.upstreams]]
id = "gemini_flash_a"
version = "v1"
url = "https://aidp-i18ntt-sg.tiktok-row.net/api/modelhub/online/v2/crawl"
ak = "replace-with-gemini-flash-a-ak"
weight = 200
status = "active"

[[models.upstreams]]
id = "gemini_flash_b"
version = "v1"
url = "https://aidp-i18ntt-sg.tiktok-row.net/api/modelhub/online/v2/crawl"
ak = "replace-with-gemini-flash-b-ak"
weight = 200
status = "active"

[[models.upstreams]]
id = "gemini_flash_c"
version = "v1"
url = "https://aidp-i18ntt-sg.tiktok-row.net/api/modelhub/online/v2/crawl"
ak = "replace-with-gemini-flash-c-ak"
weight = 200
status = "active"
