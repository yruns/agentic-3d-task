site_name: Agentic 3D Task Docs
site_description: Project documentation for agentic 3D scene understanding tasks.
docs_dir: docs
site_dir: site
strict: false

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

plugins:
  - search

exclude_docs: |
  superpowers/**

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

nav:
  - Home: index.md
  - Development Standards:
      - Python Code Agent Quality Guide: python_code_agent_quality_guide.md
  - Codex Agent:
      - Overview: codex_agent/index.md
      - NR3D Tools Plan: codex_agent/nr3d_tools_plan_20260609.md
      - View Image Adapter Fix: codex_agent/view_image_adapter_fix_20260609.md
      - Prompt Caching: codex_agent/prompt_caching_20260608.md
      - Reasoning Summary And Effort: codex_agent/reasoning_summary_and_effort_20260610.md
      - Reasoning Carryover, Caching, And AK Routing: codex_agent/reasoning_carryover_caching_ak_routing_20260611.md
      - Skill Loop And Reasoning Dropped: codex_agent/skill_loop_and_reasoning_dropped_20260609.md
